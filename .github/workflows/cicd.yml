name: CICD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main


jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pylint
        run: |
          pylint *.py --fail-under=5 --fail-on=E

      # - name: Run tests
      #   run: |
      #     python -m pytest


      - name: Build Docker image
        run: |
          docker build -t group04-healthcare .
          

      - name: Run Test the container for test case 1
        run: |
          docker run --rm -i group04-healthcare < tests/test_input_male.txt
      
      - name: Run Test the container for test case 2 
        run: |
          docker run --rm -i group04-healthcare < tests/test_input_male_ai_bypass.txt
      
      - name: Run Test the container for test case 3  
        run: |
          docker run --rm -i group04-healthcare < tests/test_input_female.txt