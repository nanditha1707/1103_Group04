name: CICD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main


jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pylint
        run: |
          pylint *.py --fail-under=5 --fail-on=E


      - name: Build Docker image
        run: |
          docker build -t group04-healthcare .
          

      # Runs the container once per .txt file in tests/
      - name: Run Docker container with each test input
        run: |
          for test_file in tests/*.txt; do
            echo "::group::$test_file"
            grep -v '^#' "$test_file" | docker run --rm -i group04-healthcare
            echo "::endgroup::"
          done